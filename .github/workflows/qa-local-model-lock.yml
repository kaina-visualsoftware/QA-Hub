name: QA Hub local model dependency lock (temporary)
on:
  push:
    branches: ['feat/issue-37-react-foundation']
    paths:
      - '.github/workflows/qa-local-model-lock.yml'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned on-device inference engine
        run: npm install --no-audit --no-fund
      - name: Validate clean install
        run: npm ci --no-audit --no-fund
      - name: Export resolved lockfile in nonsecret chunks
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data=Path('package-lock.json').read_bytes()
          s=base64.b64encode(data).decode('ascii')
          for i in range(0,len(s),1000):
            print('MODEL_LOCK_CHUNK:'+s[i:i+1000])
          print('MODEL_LOCK_SIZE:'+str(len(data)))
          PY
