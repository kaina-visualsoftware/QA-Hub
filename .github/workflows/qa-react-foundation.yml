name: QA Hub React foundation
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/qa-react-foundation.yml'
  push:
    branches: ['feat/issue-37-react-foundation']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production bundle
        run: npm run build
      - name: Preview artifact (not deployment)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qa-hub-react-preview
          path: frontend/dist/
          retention-days: 7
