name: QA Hub lockfile export (temporary)
on:
  push:
    branches: ['feat/issue-37-react-foundation']
    paths:
      - '.github/workflows/qa-lockfile-export.yml'
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve deterministic package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Export lockfile text as transport chunks
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          raw = Path('package-lock.json').read_bytes()
          value = base64.b64encode(raw).decode('ascii')
          for position in range(0, len(value), 1000):
              print('LOCK37_CHUNK:' + value[position:position + 1000])
          print('LOCK37_SIZE:' + str(len(raw)))
          PY
