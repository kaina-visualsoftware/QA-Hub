<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#102f3b">
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">
  <title>QA Hub · Abrindo nova versão</title>
  <script>
    // Supabase's existing redirect allowlist points to qa.html.
    // Deliver an OTP/code/fragment to the standalone React callback before
    // TanStack's hash router can interpret it as a navigation route.
    (function () {
      const current = new URL(window.location.href);
      const query = current.searchParams;
      const rawHash = current.hash;
      const callback = ["code", "token_hash", "error", "error_code", "type"]
        .some((key) => query.has(key)) ||
        /^#(?:access_token|refresh_token|error|error_code|token_hash|type)=/i.test(rawHash);
      const target = new URL(callback ? "./react/auth.html" : "./react/", current);
      if (callback) {
        target.search = current.search;
        target.hash = rawHash;
      } else {
        // Map compatible hash routes; unknown legacy routes safely open home.
        if (/^#\/(?:tarefa\/|publicas|recuperar|painel|ferramentas|perfil|admin)/.test(rawHash)) {
          target.hash = rawHash;
        } else {
          const legacyTask = rawHash.match(/^#\/tarefas\/([0-9a-f-]{36})(?:\?.*)?$/i);
          target.hash = legacyTask ? "#/tarefa/" + legacyTask[1] : "#/";
        }
      }
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <main>
    <h1>QA Hub</h1>
    <p>Abrindo a nova versão da plataforma.</p>
    <p><a href="./react/">Abrir QA Hub React</a></p>
  </main>
</body>
</html>
