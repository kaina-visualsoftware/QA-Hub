<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102f3b">
  <meta name="description" content="QA Hub — sistema para criar tarefas e executar cenários de teste.">
  <title>QA Hub · Workspace de testes</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">
  <link rel="canonical" href="https://kaina-visualsoftware.github.io/QA-Hub/react/">
  <script>
    (function () {
      const current = new URL(window.location.href);
      const callback = ["code", "token_hash", "error", "error_code", "type"]
        .some((key) => current.searchParams.has(key)) ||
        /^#(?:access_token|refresh_token|error|error_code|token_hash|type)=/i.test(current.hash);
      const target = new URL(callback ? "./react/auth.html" : "./react/", current);
      if (callback) {
        target.search = current.search;
        target.hash = current.hash;
      } else if (/^#\/(?:tarefa\/|publicas|recuperar|painel|ferramentas|perfil|admin)/.test(current.hash)) {
        target.hash = current.hash;
      } else {
        target.hash = "#/";
      }
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <main>
    <h1>QA Hub</h1>
    <p>Abrindo o novo ambiente de testes.</p>
    <p><a href="./react/">Entrar no QA Hub</a></p>
  </main>
</body>
</html>
