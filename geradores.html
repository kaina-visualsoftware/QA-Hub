<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Ferramentas atualizadas · QA Hub</title>
  <script>
    (() => {
      const current = new URL(window.location.href);
      const destination = new URL("./react/", current);
      // Os antigos geradores avulsos agora fazem parte da área de ferramentas
      // ou do fluxo de cada tarefa. Não reabrir a interface legada.
      const oldTool = current.hash.replace(/^#/, "").replace(/^\//, "");
      destination.hash = /^(post|teste|casos)(?:$|\?)/i.test(oldTool)
        ? "#/" : "#/ferramentas";
      window.location.replace(destination.href);
    })();
  </script>
</head>
<body>
  <main>
    <h1>QA Hub</h1>
    <p>Esta página foi migrada para a interface React.</p>
    <a href="./react/#/ferramentas">Abrir o QA Hub</a>
  </main>
</body>
</html>
