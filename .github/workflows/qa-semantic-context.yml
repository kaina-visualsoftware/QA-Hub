name: QA Hub semantic context F2/F3
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/qa-context/**'
      - 'frontend/src/features/generators/**'
      - 'frontend/src/features/tasks/NewTaskWizard.tsx'
      - 'frontend/tests/semantic-context.test.ts'
      - '.github/workflows/qa-semantic-context.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/qa-context/**'
      - 'frontend/src/features/generators/**'
      - 'frontend/src/features/tasks/NewTaskWizard.tsx'
      - 'frontend/tests/semantic-context.test.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Edge Function's pure evidence checks
        working-directory: .
        run: node --test supabase/functions/qa-context/facts.test.mjs
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund --onnxruntime-node-install-cuda=skip
      - name: Verify type checking
        run: npm run typecheck
      - name: Test semantic chunking, citations, and coverage
        run: npx vitest run tests/semantic-context.test.ts tests/context-preparation.test.ts
      - name: Production build
        run: npm run build
