<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow"/>
  <meta name="referrer" content="no-referrer"/>
  <meta name="theme-color" content="#102f3b"/>
  <title>Confirmar acesso · QA Hub</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#18333e;background:#f3f6f6}
    *{box-sizing:border-box}
    body{min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}
    main{background:white;border:1px solid #d9e6e7;border-radius:16px;padding:30px;width:min(420px,100%);box-shadow:0 8px 30px #18333e0e}
    h1{margin:0 0 12px;font-size:1.5rem}p{line-height:1.6;color:#3e5b62}
    a{display:inline-block;margin-top:12px;color:#146574;text-decoration:underline}
  </style>
</head>
<body>
  <main>
    <h1>Confirmar acesso</h1>
    <p id="callback-status" role="status" aria-live="polite">Validando o link com segurança…</p>
    <a id="callback-return" href="./#/">Voltar ao QA Hub</a>
  </main>
  <script type="module" src="/src/features/auth/callback-entry.ts"></script>

</html>
