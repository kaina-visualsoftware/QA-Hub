name: QA Hub checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript modules
        run: |
          node --check qa.js
          node --check qa-parser.mjs
          node --check qa-config.js
      - name: Run report parser tests
        run: node --test tests/*.test.mjs
      - name: Detect accidental sensitive credentials in app code
        run: |
          if grep -RniE '(service_role|sb_secret_)' --include='qa*.js' --include='qa*.mjs' . | grep -v 'NUNCA\|nunca'; then
            echo 'Privileged Supabase credential reference found in frontend'; exit 1
          fi
