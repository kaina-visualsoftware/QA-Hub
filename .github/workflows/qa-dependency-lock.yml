name: QA Hub dependency lock refresh (temporary)
on:
  push:
    branches: ['feat/issue-37-react-foundation']
    paths:
      - '.github/workflows/qa-dependency-lock.yml'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF and DOCX parsers and resolve lockfile
        run: npm install --no-audit --no-fund
      - name: Verify clean installation using resolved lockfile
        run: npm ci --no-audit --no-fund
      - name: Export resolved package-lock as nonsecret transport chunks
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data=Path('package-lock.json').read_bytes()
          encoded=base64.b64encode(data).decode('ascii')
          for i in range(0,len(encoded),1000):
            print('LOCK38_CHUNK:'+encoded[i:i+1000])
          print('LOCK38_SIZE:'+str(len(data)))
          PY
