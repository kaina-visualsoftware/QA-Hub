name: QA Hub lockfile export (temporary)
on:
  push:
    branches: ['feat/issue-37-react-foundation']
    paths:
      - '.github/workflows/qa-lockfile-export.yml'
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile full npm install
        run: npm install --no-audit --no-fund
      - name: Export reconciled lockfile
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          raw=Path('package-lock.json').read_bytes()
          value=base64.b64encode(raw).decode('ascii')
          for i in range(0,len(value),1000):
              print('LOCK37_CHUNK:' + value[i:i+1000])
          print('LOCK37_SIZE:' + str(len(raw)))
          PY
