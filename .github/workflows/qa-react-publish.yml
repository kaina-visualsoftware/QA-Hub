name: QA Hub React - publicar bundle versionado

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/qa-react-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qa-hub-react-pages-bundle
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and verify React contracts
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund --onnxruntime-node-install-cuda=skip
          npm run typecheck
          npm run lint
          npm test
      - name: Build production React under /QA-Hub/react/
        working-directory: frontend
        env:
          QA_VITE_BASE: /QA-Hub/react/
          VITE_SUPABASE_URL: https://pqadmlhcsimlcclpkyov.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3Duz2dETsyYNPtfY-8Mxjw_pGBvCUP9
          # Add this URL to Supabase Auth > URL Configuration > Redirect URLs.
          # /QA-Hub/qa.html remains a callback-compatible redirect.
          VITE_AUTH_REDIRECT_URL: https://kaina-visualsoftware.github.io/QA-Hub/react/auth.html
          # Public read RPCs installed; direct anon SELECT revoked on 3 tables.
          # Owner-publishing is still constrained by server-side RLS policies.
          VITE_PUBLIC_SHARING_ENABLED: 'true'
        run: |
          npm run build
          node scripts/check-bundle-budget.mjs
          test -s dist/index.html
          test -s dist/auth.html
          test -s dist/favicon.svg
          test -s dist/favicon.png
          test -s dist/icon-192.png
          test -s dist/site.webmanifest
          grep -q '/QA-Hub/react/favicon.png' dist/index.html
          grep -q '/QA-Hub/react/favicon.png' dist/auth.html
          test -d dist/assets
          grep -q '/QA-Hub/react/assets/' dist/index.html
      - name: Commit generated React bundle to GitHub Pages source
        shell: bash
        run: |
          set -euo pipefail
          # react/ is an Actions-owned output tree; never delete arbitrary files.
          if [ -e react ] && [ ! -f react/.qa-react-generated ]; then
            echo 'Refusing to replace an unmanaged react/ directory.'
            exit 1
          fi
          # Keep the current and two previous releases' hashed chunks.
          # A tab left open during deploy may still import the old Mermaid bundle.
          # Deleting those assets causes "Failed to fetch dynamically imported module".
          previous="$(mktemp -d)"
          trap 'rm -rf "$previous"' EXIT
          if [ -d react/assets ]; then
            mkdir -p "$previous/assets"
            cp -a react/assets/. "$previous/assets/"
            if [ -s react/.qa-react-current-assets ]; then
              cp react/.qa-react-current-assets "$previous/current"
            else
              find react/assets -maxdepth 1 -type f -printf '%f\n' | sort > "$previous/current"
            fi
            if [ -s react/.qa-react-prior-1-assets ]; then
              cp react/.qa-react-prior-1-assets "$previous/prior-1"
            fi
          fi
          rm -rf react
          mkdir -p react
          cp -a frontend/dist/. react/
          # Record the freshly generated assets before restoring historical chunks.
          find react/assets -maxdepth 1 -type f -printf '%f\n' | sort > react/.qa-react-current-assets
          : > react/.qa-react-prior-1-assets
          : > react/.qa-react-prior-2-assets
          if [ -f "$previous/current" ]; then
            cp "$previous/current" react/.qa-react-prior-1-assets
          fi
          if [ -f "$previous/prior-1" ]; then
            cp "$previous/prior-1" react/.qa-react-prior-2-assets
          fi
          for manifest in react/.qa-react-prior-1-assets react/.qa-react-prior-2-assets; do
            while IFS= read -r asset; do
              # Names come from generated build manifests, never external input.
              if [ -n "$asset" ] && [ "$asset" = "${asset##*/}" ] \
                && [ -f "$previous/assets/$asset" ] \
                && [ ! -e "react/assets/$asset" ]; then
                cp "$previous/assets/$asset" "react/assets/$asset"
              fi
            done < "$manifest"
          done
          touch react/.nojekyll
          cat > react/.qa-react-generated <<'EOF'
          Generated React build managed by .github/workflows/qa-react-publish.yml.
          Do not edit generated assets directly; edit frontend/ and publish again.
          EOF
          # Remember the exact source snapshot that produced dist/.
          # A superseded build must never publish stale JavaScript over newer TF UI changes.
          bundle_source_sha="$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A react
          if git diff --cached --quiet; then
            echo 'No React bundle changes to publish.'
            exit 0
          fi
          git commit -m 'build: publicar bundle React em react/ com publicação segura'
          # Other legitimate commits may land on main during a large build.
          # Replay the generated bundle on top of the current head; never force.
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$bundle_source_sha" origin/main -- frontend .github/workflows/qa-react-publish.yml; then
              echo "A newer source or publish workflow changed during the build. Skipping stale bundle; a newer workflow will publish."
              exit 0
            fi
            # Generated paths are Actions-owned. Theirs means OUR generated commit
            # during rebase, resolving concurrent manifest/index updates safely.
            git rebase --strategy-option=theirs origin/main
            # Preserve any hashed chunks added by another successful deploy while
            # this job was building, so previously opened browser tabs keep working.
            while IFS= read -r asset; do
              if [ -n "$asset" ] && [ ! -e "$asset" ]; then
                mkdir -p "$(dirname "$asset")"
                git show "origin/main:$asset" > "$asset"
              fi
            done < <(git ls-tree -r --name-only origin/main react/assets)
            git add -A react
            if ! git diff --cached --quiet; then
              git commit -m 'build: preservar assets versionados de deploy concorrente'
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Another commit landed during push attempt ${attempt}; retrying safely."
          done
          if [ "$pushed" -ne 1 ]; then
            echo 'ERROR: Could not publish generated assets without overwriting another commit.'
            exit 1
          fi
          echo 'React bundle committed. Compatibility redirects preserved.'
