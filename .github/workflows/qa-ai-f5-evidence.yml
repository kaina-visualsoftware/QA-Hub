name: QA Hub AI F5 — evidências e schema estrito
on:
  pull_request:
    branches: [main, feat/ai-pipeline-f4-staged-task-20261111]
    paths:
      - 'supabase/functions/qa-ai/**'
      - 'frontend/src/features/tasks/**'
      - 'frontend/tests/task-evidence.test.ts'
      - 'frontend/tests/task-ai-phased.test.ts'
      - 'tests/ai-f5-*.test.mjs'
      - '.github/workflows/qa-ai-f5-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/qa-ai/**'
      - 'frontend/src/features/tasks/task-evidence.ts'
      - 'tests/ai-f5-*.test.mjs'
concurrency:
  group: qa-ai-f5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Grounding and F0-F4 regression contracts
        run: |
          node --test tests/ai-f5-grounding.test.mjs tests/ai-f4-stages.test.mjs tests/ai-f3-token-budget.test.mjs tests/ai-f3-integration.test.mjs tests/ai-f2-error-contract.test.mjs tests/ai-f1-provider.test.mjs tests/ai-f0-telemetry.test.mjs tests/ai-f0-contract.test.mjs
      - name: Syntax of the pure evidence module
        run: |
          node --check supabase/functions/qa-ai/stages.mjs
          node --check supabase/functions/qa-ai/grounding.mjs
  edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck all four authenticated Edge Functions
        run: |
          deno check supabase/functions/qa-ai/index.ts
          deno check supabase/functions/qa-generators/index.ts
          deno check supabase/functions/qa-context/index.ts
          deno check supabase/functions/qa-revisions/index.ts
      - name: Strict Zod, JSON repair and citation tests
        run: deno test supabase/functions/qa-ai/schemas.test.ts
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund --onnxruntime-node-install-cuda=skip
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: F5 evidence and phased TF regressions
        run: npx vitest run tests/task-evidence.test.ts tests/task-ai-phased.test.ts tests/task-ai-input.test.ts tests/task-ai.test.ts
      - name: Full frontend tests
        run: npm test
      - name: Production build
        run: npm run build
