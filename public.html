<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Biblioteca pública atualizada · QA Hub</title>
  <script>
    (() => {
      const current = new URL(window.location.href);
      const destination = new URL("./react/", current);
      const fromQuery = current.searchParams.get("tf");
      const fromHash = new URLSearchParams(current.hash.replace(/^#/, "")).get("tf");
      const tf = fromQuery || fromHash;
      destination.hash = "#/publicas" +
        (tf && /^[0-9a-f-]{36}$/i.test(tf) ? "?tf=" + encodeURIComponent(tf) : "");
      window.location.replace(destination.href);
    })();
  </script>
</head>
<body>
  <main>
    <h1>QA Hub</h1>
    <p>Esta página foi migrada para a interface React.</p>
    <a href="./react/#/publicas">Abrir o QA Hub</a>
  </main>
</body>
</html>
